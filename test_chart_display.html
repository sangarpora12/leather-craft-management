<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Data Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chart-container { width: 800px; height: 400px; margin: 20px 0; }
        .data-display { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        pre { white-space: pre-wrap; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Chart Data Test Display</h1>

    <div class="data-display">
        <h3>Chart Data from PHP:</h3>
        <div id="chartDataDisplay"></div>
    </div>

    <div class="chart-container">
        <canvas id="testChart"></canvas>
    </div>

    <script>
        // Simulate the chart data that would come from Laravel
        const chartData = {
            bahan: [
                {nama: 'Kulit Sapi Premium', stok: 150, min_stok: 50},
                {nama: 'Benang Nilon Waxed', stok: 25, min_stok: 30},
                {nama: 'Lem Aica Bond', stok: 8, min_stok: 10},
                {nama: 'Kancing Logam', stok: 200, min_stok: 100},
                {nama: 'Ritsleting YKK', stok: 75, min_stok: 50}
            ],
            produk: [
                {nama: 'Tas Kulit Executive', stok: 45},
                {nama: 'Dompet Kulit Klasik', stok: 120},
                {nama: 'Sabuk Kulit Premium', stok: 85},
                {nama: 'Tas Selempang Wanita', stok: 65},
                {nama: 'Koper Kulit', stok: 25}
            ],
            produksi: [
                {month: 'Jan 2024', total: 120},
                {month: 'Feb 2024', total: 150},
                {month: 'Mar 2024', total: 180},
                {month: 'Apr 2024', total: 200},
                {month: 'May 2024', total: 170},
                {month: 'Jun 2024', total: 190}
            ],
            produksi_harian: [
                {day: 'Min', total: 25},
                {day: 'Sen', total: 30},
                {day: 'Sel', total: 35},
                {day: 'Rab', total: 40},
                {day: 'Kam', total: 45},
                {day: 'Jum', total: 50},
                {day: 'Sab', total: 55}
            ],
            keuntungan: [
                {nama: 'Tas Kulit Executive', keuntungan: 250000},
                {nama: 'Dompet Kulit Klasik', keuntungan: 100000},
                {nama: 'Sabuk Kulit Premium', keuntungan: 60000},
                {nama: 'Tas Selempang Wanita', keuntungan: 130000},
                {nama: 'Koper Kulit', keuntungan: 400000}
            ]
        };

        // Display the data
        document.getElementById('chartDataDisplay').innerHTML = '<pre>' + JSON.stringify(chartData, null, 2) + '</pre>';

        // Create test chart
        const ctx = document.getElementById('testChart').getContext('2d');
        const config = {
            type: 'bar',
            data: {
                labels: chartData.bahan.map(item => item.nama.substring(0, 15) + (item.nama.length > 15 ? '...' : '')),
                datasets: [{
                    label: 'Stok Tersedia',
                    data: chartData.bahan.map(item => item.stok),
                    backgroundColor: 'rgba(20, 184, 166, 0.8)',
                    borderColor: 'rgba(20, 184, 166, 1)',
                    borderWidth: 1
                }, {
                    label: 'Batas Minimum',
                    data: chartData.bahan.map(item => item.min_stok),
                    backgroundColor: 'rgba(239, 68, 68, 0.8)',
                    borderColor: 'rgba(239, 68, 68, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        ticks: { color: 'rgba(0, 0, 0, 0.7)' }
                    },
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        ticks: {
                            color: 'rgba(0, 0, 0, 0.7)',
                            maxRotation: 45,
                            minRotation: 45
                        }
                    }
                },
                plugins: {
                    legend: { labels: { color: 'rgba(0, 0, 0, 0.7)' } }
                }
            }
        };

        new Chart(ctx, config);
        console.log('Chart created successfully with test data');
    </script>
</body>
</html>
